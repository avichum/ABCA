AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Hosting for the ABCA static site: a private S3 bucket fronted by a CloudFront
  distribution (HTTPS, origin access control). Upload index.html / style.css to
  the bucket after the stack is created.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Site
        Parameters:
          - ProjectName
          - IndexDocument
      - Label:
          default: CloudFront
        Parameters:
          - PriceClass
    ParameterLabels:
      ProjectName:
        default: Project name (used as a resource name prefix)
      IndexDocument:
        default: Default root object
      PriceClass:
        default: CloudFront price class

Parameters:
  ProjectName:
    Type: String
    Default: abca
    Description: Lowercase prefix used when naming the S3 bucket and CloudFront comment.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: >-
      Must be 3-32 characters of lowercase letters, numbers or hyphens, and must
      start and end with a letter or number.

  IndexDocument:
    Type: String
    Default: index.html
    Description: Object served for requests to the distribution root.
    AllowedPattern: "^[A-Za-z0-9._-]+$"

  PriceClass:
    Type: String
    Default: PriceClass_100
    Description: >-
      Edge locations used by the distribution. PriceClass_100 (US/Canada/Europe)
      is the cheapest; PriceClass_All uses every region.
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

Resources:
  # Private origin bucket. Nothing is public: CloudFront reads it through the
  # origin access control below, so the website-hosting endpoint is not needed.
  SiteBucket:
    Type: AWS::S3::Bucket
    # Keep the objects if the stack is removed; delete the bucket by hand.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  # Allow only this distribution to read objects from the bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-site-oac"
        Description: !Sub "Origin access control for the ${ProjectName} static site bucket."
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} static site"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: !Ref IndexDocument
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            # Required by CloudFront for S3 origins used with OAC.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policies: CachingOptimized + SecurityHeadersPolicy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          # Missing keys return 403 from S3 with OAC; show the site page instead.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: !Sub "/${IndexDocument}"
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: !Sub "/${IndexDocument}"
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          # Default *.cloudfront.net certificate; swap for ACM + Aliases to use
          # a custom domain.
          CloudFrontDefaultCertificate: true

Outputs:
  SiteBucketName:
    Description: S3 bucket that holds the site files.
    Value: !Ref SiteBucket

  DistributionId:
    Description: CloudFront distribution id (use it to create invalidations).
    Value: !Ref SiteDistribution

  DistributionDomainName:
    Description: CloudFront domain name for the distribution.
    Value: !GetAtt SiteDistribution.DomainName

  SiteUrl:
    Description: Public URL of the deployed site.
    Value: !Sub "https://${SiteDistribution.DomainName}"
